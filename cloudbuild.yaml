substitutions:
  _REGION: asia-southeast1
  _IMAGE: asia-southeast1-docker.pkg.dev/data-ads-external-report-prod/etl-google-ads/v2.0.2

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY